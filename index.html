<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Life Tracker — budget, habits, savings, and projects in one place." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none';" />
  <meta name="theme-color" content="#2563eb" />
  <title>Life Tracker</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <span class="app-header__title">Life Tracker</span>
    <div class="app-header__actions">
      <button id="btn-install-pwa" class="btn btn--icon" hidden aria-label="Install app">⬇</button>
      <button id="theme-toggle" class="btn btn--icon" aria-label="Toggle dark mode">☾</button>
    </div>
  </header>

  <!-- ── Main content ───────────────────────────────────────────────────── -->
  <main class="app-main">

    <!-- Dashboard page -->
    <section id="page-dashboard" class="page" aria-label="Dashboard"></section>

    <!-- Budget page -->
    <section id="page-budget" class="page" aria-label="Budget" hidden>
      <div id="budget-alerts" role="alert" aria-live="polite"></div>

      <!-- Budget summary card -->
      <div class="card budget-summary">
        <div class="budget-summary__row">
          <button id="btn-open-budget-settings" class="btn btn--secondary btn--sm">Edit Budget</button>
          <div class="budget-summary__actions">
            <button id="btn-export-data" class="btn btn--secondary btn--sm">Export</button>
            <button id="btn-import-data" class="btn btn--secondary btn--sm">Import</button>
            <input id="input-import-file" type="file" accept="application/json" hidden aria-label="Import data file" />
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__label">Monthly Income</div>
            <div class="stat-card__value">$<span id="budget-salary">0</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card__label">After Bills</div>
            <div class="stat-card__value">$<span id="budget-total">0</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card__label">Needs (<span id="budget-needs-pct">50</span>%)</div>
            <div class="stat-card__value">$<span id="budget-needs-amount">0</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card__label">Wants (<span id="budget-wants-pct">30</span>%)</div>
            <div class="stat-card__value">$<span id="budget-wants-amount">0</span></div>
          </div>
        </div>
      </div>

      <!-- Recurring bills -->
      <div class="card">
        <div class="card__header">
          <h2 class="card__title">Recurring Bills</h2>
          <button id="btn-open-add-bill" class="btn btn--primary btn--sm">+ Add</button>
        </div>
        <div id="recurring-bills-list"></div>
      </div>

      <!-- Transaction filters -->
      <div class="filter-bar card">
        <div class="filter-row">
          <input id="filter-search" type="search" placeholder="Search..." aria-label="Search transactions" />
          <select id="filter-type" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="filter-row">
          <input id="filter-category" type="text" placeholder="Category..." aria-label="Filter by category" />
          <input id="filter-date-from" type="date" aria-label="From date" />
          <input id="filter-date-to"   type="date" aria-label="To date" />
          <button id="filter-clear" class="btn btn--secondary btn--sm">Clear</button>
        </div>
      </div>

      <!-- Transactions -->
      <div class="card">
        <div class="card__header">
          <h2 class="card__title">Transactions</h2>
          <button id="btn-open-add-transaction" class="btn btn--primary btn--sm">+ Add</button>
        </div>
        <div id="transactions-list"></div>
      </div>
    </section>

    <!-- Habits page -->
    <section id="page-habits" class="page" aria-label="Habits" hidden>
      <div class="card">
        <div class="card__header">
          <button id="habit-date-prev" class="btn btn--icon" aria-label="Previous day">&#8249;</button>
          <span id="habit-date" class="habit-date-label"></span>
          <button id="habit-date-next" class="btn btn--icon" aria-label="Next day">&#8250;</button>
          <button id="btn-open-add-habit" class="btn btn--primary btn--sm">+ Add</button>
        </div>
        <div id="habits-list"></div>
      </div>
    </section>

    <!-- Savings page — rendered by Savings.renderSavingsPage() -->
    <section id="page-savings" class="page" aria-label="Savings" hidden></section>

    <!-- Projects page — rendered by Projects.renderProjectsPage() -->
    <section id="page-projects" class="page" aria-label="Projects" hidden></section>

  </main>

  <!-- ── Bottom nav ─────────────────────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn" data-page="dashboard" aria-label="Dashboard" aria-current="page">
      <span class="nav-btn__icon" aria-hidden="true">&#9638;</span>
      <span class="nav-btn__label">Dashboard</span>
    </button>
    <button class="nav-btn" data-page="budget" aria-label="Budget">
      <span class="nav-btn__icon" aria-hidden="true">$</span>
      <span class="nav-btn__label">Budget</span>
    </button>
    <button class="nav-btn" data-page="habits" aria-label="Habits">
      <span class="nav-btn__icon" aria-hidden="true">&#10003;</span>
      <span class="nav-btn__label">Habits</span>
    </button>
    <button class="nav-btn" data-page="savings" aria-label="Savings">
      <span class="nav-btn__icon" aria-hidden="true">&#8593;</span>
      <span class="nav-btn__label">Savings</span>
    </button>
    <button class="nav-btn" data-page="projects" aria-label="Projects">
      <span class="nav-btn__icon" aria-hidden="true">&#9670;</span>
      <span class="nav-btn__label">Projects</span>
    </button>
  </nav>

  <!-- ── Modals ─────────────────────────────────────────────────────────── -->

  <!-- Budget settings modal -->
  <div id="modal-budget-settings" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbl-budget-settings">
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="lbl-budget-settings" class="modal__title">Budget Settings</h2>
        <button class="btn btn--icon" data-close-modal="modal-budget-settings" aria-label="Close">&times;</button>
      </div>
      <div class="form-group">
        <label for="input-salary">Monthly Income ($)</label>
        <input id="input-salary" type="number" min="0" step="1" placeholder="e.g. 4000" />
      </div>
      <div class="form-group">
        <label for="input-needs-pct">Needs % (e.g. 50)</label>
        <input id="input-needs-pct" type="number" min="0" max="100" step="1" placeholder="50" />
      </div>
      <div class="form-group">
        <label for="input-wants-pct">Wants % (e.g. 30)</label>
        <input id="input-wants-pct" type="number" min="0" max="100" step="1" placeholder="30" />
      </div>
      <div class="modal__footer">
        <button id="btn-save-budget-settings" class="btn btn--primary btn--full">Save</button>
      </div>
    </div>
  </div>

  <!-- Add transaction modal -->
  <div id="modal-add-transaction" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbl-add-transaction">
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="lbl-add-transaction" class="modal__title">Add Transaction</h2>
        <button class="btn btn--icon" data-close-modal="modal-add-transaction" aria-label="Close">&times;</button>
      </div>
      <div class="form-group">
        <label for="input-transaction-type">Type</label>
        <select id="input-transaction-type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>
      <div class="form-group">
        <label for="input-transaction-category">Category</label>
        <select id="input-transaction-category">
          <optgroup label="Needs">
            <option>Rent/Mortgage</option>
            <option>Utilities</option>
            <option>Groceries</option>
            <option>Transportation</option>
            <option>Healthcare</option>
            <option>Insurance</option>
            <option>Phone</option>
            <option>Internet</option>
          </optgroup>
          <optgroup label="Wants">
            <option>Dining Out</option>
            <option>Entertainment</option>
            <option>Shopping</option>
            <option>Subscriptions</option>
            <option>Travel</option>
            <option>Hobbies</option>
            <option>Personal Care</option>
          </optgroup>
          <optgroup label="Income">
            <option>Salary</option>
            <option>Freelance</option>
            <option>Side Income</option>
            <option>Investment</option>
            <option>Refund</option>
            <option>Gift</option>
          </optgroup>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="input-transaction-amount">Amount ($)</label>
        <input id="input-transaction-amount" type="number" min="0.01" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="input-transaction-description">Description (optional)</label>
        <input id="input-transaction-description" type="text" maxlength="200" placeholder="Optional note" />
      </div>
      <div class="form-group">
        <label for="input-transaction-date">Date</label>
        <input id="input-transaction-date" type="date" />
      </div>
      <div class="modal__footer">
        <button id="btn-save-transaction" class="btn btn--primary btn--full">Add Transaction</button>
      </div>
    </div>
  </div>

  <!-- Add recurring bill modal -->
  <div id="modal-add-bill" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbl-add-bill">
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="lbl-add-bill" class="modal__title">Add Recurring Bill</h2>
        <button class="btn btn--icon" data-close-modal="modal-add-bill" aria-label="Close">&times;</button>
      </div>
      <div class="form-group">
        <label for="input-bill-name">Bill Name</label>
        <input id="input-bill-name" type="text" maxlength="100" placeholder="e.g. Netflix" />
      </div>
      <div class="form-group">
        <label for="input-bill-amount">Amount ($)</label>
        <input id="input-bill-amount" type="number" min="0.01" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="input-bill-due-day">Due Day of Month (1–31)</label>
        <input id="input-bill-due-day" type="number" min="1" max="31" step="1" placeholder="1" />
      </div>
      <div class="form-group">
        <label for="input-bill-category">Category</label>
        <select id="input-bill-category">
          <option>Rent/Mortgage</option>
          <option>Utilities</option>
          <option>Insurance</option>
          <option>Phone</option>
          <option>Internet</option>
          <option>Subscriptions</option>
          <option>Transportation</option>
          <option>Healthcare</option>
          <option>Other</option>
        </select>
      </div>
      <div class="modal__footer">
        <button id="btn-save-bill" class="btn btn--primary btn--full">Add Bill</button>
      </div>
    </div>
  </div>

  <!-- Add habit modal -->
  <div id="modal-add-habit" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbl-add-habit">
    <div class="modal__content modal__content--tall">
      <div class="modal__header">
        <h2 id="lbl-add-habit" class="modal__title">Add Habits</h2>
        <button class="btn btn--icon" data-close-modal="modal-add-habit" aria-label="Close">&times;</button>
      </div>
      <div class="form-group form-group--inline">
        <input id="input-custom-habit-name" type="text" maxlength="100" placeholder="Custom habit name..." />
        <select id="input-custom-habit-category">
          <option value="Morning Routine">Morning</option>
          <option value="Afternoon/Work">Afternoon</option>
          <option value="Evening Routine">Evening</option>
          <option value="Anytime/Daily" selected>Anytime</option>
        </select>
        <button id="habit-custom-add" class="btn btn--secondary btn--sm">Add</button>
      </div>
      <div id="habit-checklist" class="habit-checklist-scroll"></div>
      <div class="modal__footer modal__footer--row">
        <button id="btn-cancel-habit-modal" class="btn btn--secondary">Cancel</button>
        <button id="btn-save-habits" class="btn btn--primary">Save Selected</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts (load order: utils → store → features → charts → app) ──── -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/savings.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
